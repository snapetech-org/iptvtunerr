# ng-runner-policy: private-jit-only-v1
# CI: single source of truth is scripts/verify (runs scripts/verify-steps.sh).
# Go version from go.mod to avoid runner drift.

name: CI

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        type: choice
        required: true
        options: [ci]
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        type: choice
        required: true
        options: [private]
permissions:
  contents: read

concurrency:
  group: ng-ci-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install verification tools
        run: bash scripts/install-ci-tools.sh ripgrep

      - name: Release-note gate
        env:
          BASE_SHA: ${{ github.event.before || format('{0}~1', github.sha) }}
          HEAD_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/release-note-context.md"
          commit_context="$PR_BODY"
          if [[ -z "$commit_context" ]]; then
            commit_context="$(git show -s --format=%B "$HEAD_SHA")"
          fi
          printf '%s' "$commit_context" > "$body_file"
          validation_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            validation_args+=(--allow-mixed-push-batch)
          fi
          node scripts/check-release-notes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${validation_args[@]}"
          node scripts/check-changelog-tags.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Verify (runs scripts/verify-steps.sh or template default)
        run: ./scripts/verify

  smoke:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}"]}}', github.run_id)) }}
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Binary smoke
        run: bash ./scripts/ci-smoke.sh

  release-assets:
    # The JIT broker preinstalls RPM and Debian tools for this job; CI keeps
    # its existing no-sudo guest policy. Hosted runners install them below.
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}"]}}', github.run_id)) }}
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Linux package tools
        run: bash scripts/install-ci-tools.sh rpm zip debian-packaging

      - name: Build release asset set
        run: ./scripts/build-release-assets.sh v0.0.0 dist

      - name: Build Linux package assets
        run: ./scripts/build-linux-package-assets.sh v0.0.0 dist

      - name: Verify release asset set
        run: ./scripts/verify-release-assets.sh v0.0.0 dist
