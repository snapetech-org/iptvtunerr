# ng-runner-policy: private-jit-only-v1
# CI: single source of truth is scripts/verify (runs scripts/verify-steps.sh).
# Go version from go.mod to avoid runner drift.

name: CI

run-name: ${{ (github.event_name == 'workflow_dispatch' && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && format('owner-pr:{0}:{1}:{2}:action:{3}:pool:{4}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id, inputs.action_tag, inputs.runner_pool_tag)) || (github.event_name == 'pull_request_target' && 'owner-pr-label-event') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('action:ci:pool:private:tag:{0}', github.ref_name)) || (github.event_name == 'workflow_dispatch' && format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag)) || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        type: choice
        required: true
        options: [ci]
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        type: choice
        required: true
        options: [private]
      pr_number:
        description: Same-repository owner pull request number
        required: false
        type: string
      pr_sha:
        description: Exact pull request head SHA
        required: false
        type: string
      target_run_id:
        description: Metadata-only label event run ID
        required: false
        type: string
      pr_author:
        description: Pull request author from the metadata event
        required: false
        type: string
      pr_repository:
        description: Pull request head repository from the metadata event
        required: false
        type: string
      pr_branch:
        description: Pull request head branch from the metadata event
        required: false
        type: string

  pull_request_target:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ng-ci-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action_tag == 'ci' &&
      inputs.runner_pool_tag == 'private' &&
      (
        (github.actor == 'snapetech' &&
         github.ref == 'refs/heads/main' &&
         inputs.pr_number == '' && inputs.pr_sha == '' &&
         inputs.target_run_id == '' && inputs.pr_author == '' &&
         inputs.pr_repository == '' && inputs.pr_branch == '') ||
        (github.actor == 'github-actions[bot]' &&
         inputs.pr_number != '' && inputs.pr_sha != '' &&
         inputs.target_run_id != '' && inputs.pr_author == 'snapetech' &&
         inputs.pr_repository == github.repository &&
         inputs.pr_branch != '' &&
         github.ref == 'refs/heads/main')
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-verify"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install verification tools
        run: bash scripts/install-ci-tools.sh ripgrep

      - name: Release-note gate
        env:
          BASE_SHA: ${{ github.event.before || format('{0}~1', github.sha) }}
          HEAD_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/release-note-context.md"
          commit_context="$PR_BODY"
          if [[ -z "$commit_context" ]]; then
            commit_context="$(git show -s --format=%B "$HEAD_SHA")"
          fi
          printf '%s' "$commit_context" > "$body_file"
          validation_args=()
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            validation_args+=(--allow-mixed-push-batch)
          fi
          node scripts/check-release-notes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${validation_args[@]}"
          node scripts/check-changelog-tags.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Verify (runs scripts/verify-steps.sh or template default)
        run: ./scripts/verify

  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action_tag == 'ci' &&
      inputs.runner_pool_tag == 'private' &&
      (
        (github.actor == 'snapetech' &&
         github.ref == 'refs/heads/main' &&
         inputs.pr_number == '' && inputs.pr_sha == '' &&
         inputs.target_run_id == '' && inputs.pr_author == '' &&
         inputs.pr_repository == '' && inputs.pr_branch == '') ||
        (github.actor == 'github-actions[bot]' &&
         inputs.pr_number != '' && inputs.pr_sha != '' &&
         inputs.target_run_id != '' && inputs.pr_author == 'snapetech' &&
         inputs.pr_repository == github.repository &&
         inputs.pr_branch != '' &&
         github.ref == 'refs/heads/main')
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-smoke"]}}', github.run_id)) }}
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Binary smoke
        run: bash ./scripts/ci-smoke.sh

  release-assets:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action_tag == 'ci' &&
      inputs.runner_pool_tag == 'private' &&
      (
        (github.actor == 'snapetech' &&
         github.ref == 'refs/heads/main' &&
         inputs.pr_number == '' && inputs.pr_sha == '' &&
         inputs.target_run_id == '' && inputs.pr_author == '' &&
         inputs.pr_repository == '' && inputs.pr_branch == '') ||
        (github.actor == 'github-actions[bot]' &&
         inputs.pr_number != '' && inputs.pr_sha != '' &&
         inputs.target_run_id != '' && inputs.pr_author == 'snapetech' &&
         inputs.pr_repository == github.repository &&
         inputs.pr_branch != '' &&
         github.ref == 'refs/heads/main')
      )
    # The JIT broker preinstalls RPM and Debian tools for this job; CI keeps
    # its existing no-sudo guest policy. Hosted runners install them below.
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-release-assets"]}}', github.run_id)) }}
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Linux package tools
        run: bash scripts/install-ci-tools.sh rpm zip debian-packaging

      - name: Build release asset set
        run: ./scripts/build-release-assets.sh v0.0.0 dist

      - name: Build Linux package assets
        run: ./scripts/build-linux-package-assets.sh v0.0.0 dist

      - name: Verify release asset set
        run: ./scripts/verify-release-assets.sh v0.0.0 dist

  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
      contains(github.event.pull_request.labels.*.name, 'action:ci') &&
      contains(github.event.pull_request.labels.*.name, 'pool:private') &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch the requested action from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from urllib.request import Request, urlopen
          repository = os.environ["GITHUB_REPOSITORY"]
          expected = "snapetech-org/iptvTunerr"
          workflow = "ci.yml"
          number = os.environ["PR_NUMBER"]
          sha = os.environ["PR_SHA"].lower()
          branch = os.environ["PR_BRANCH"]
          author = os.environ["PR_AUTHOR"]
          head_repo = os.environ["PR_REPOSITORY"]
          target = os.environ["TARGET_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          if (repository.lower() != expected.lower() or head_repo.lower() != expected.lower()
                  or author != "snapetech" or not re.fullmatch(r"[1-9][0-9]*", number)
                  or not re.fullmatch(r"[0-9a-f]{40}", sha)
                  or not re.fullmatch(r"[1-9][0-9]*", target) or not branch
                  or subprocess.run(["git","check-ref-format","--branch",branch],
                                    stdout=subprocess.DEVNULL,check=False).returncode != 0):
              raise SystemExit("invalid trusted owner PR metadata")
          payload = json.dumps({"ref": "main", "inputs": {
              "action_tag":"ci","runner_pool_tag":"private","pr_number":number,
              "pr_sha":sha,"target_run_id":target,"pr_author":author,
              "pr_repository":head_repo,"pr_branch":branch}}).encode()
          request = Request(
              f"https://api.github.com/repos/{expected}/actions/workflows/{workflow}/dispatches",
              data=payload,
              headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}",
                       "Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},
              method="POST")
          with urlopen(request, timeout=20) as response:
              if response.status not in {200,204}:
                  raise SystemExit(f"workflow dispatch returned HTTP {response.status}")
          PY

  report-owner-pr:
    name: Report trusted owner PR validation
    needs: [verify, smoke, release-assets]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'github-actions[bot]' &&
      inputs.action_tag == 'ci' &&
      inputs.runner_pool_tag == 'private' &&
      inputs.pr_number != '' && inputs.pr_sha != '' &&
      inputs.target_run_id != '' && inputs.pr_author == 'snapetech' &&
      inputs.pr_repository == github.repository &&
      inputs.pr_branch != '' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
      pull-requests: read
    steps:
      - name: Attach exact-head validation result
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: snapetech-org/iptvTunerr
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          PR_BRANCH: ${{ inputs.pr_branch }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_REPOSITORY: ${{ inputs.pr_repository }}
          TARGET_RUN_ID: ${{ inputs.target_run_id }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          JOB_RESULTS: '{"verify":"${{ needs.verify.result }},"smoke":"${{ needs.smoke.result }},"release-assets":"${{ needs.release-assets.result }}}'
          CHECK_NAME: IPTV Tunerr owner PR validation
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          repo = os.environ["EXPECTED_REPOSITORY"]
          number = os.environ["PR_NUMBER"]
          sha = os.environ["PR_SHA"].lower()
          branch = os.environ["PR_BRANCH"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["VALIDATION_RUN_ID"]
          target = os.environ["TARGET_RUN_ID"]
          results = json.loads(os.environ["JOB_RESULTS"])
          if (os.environ["GITHUB_REPOSITORY"].lower() != repo.lower()
                  or os.environ["PR_REPOSITORY"].lower() != repo.lower()
                  or os.environ["PR_AUTHOR"] != "snapetech"
                  or not re.fullmatch(r"[1-9][0-9]*", number)
                  or not re.fullmatch(r"[0-9a-f]{40}", sha)
                  or not re.fullmatch(r"[1-9][0-9]*", run_id)
                  or not re.fullmatch(r"[1-9][0-9]*", target) or not results):
              raise SystemExit("invalid owner PR validation metadata")
          headers = {"Accept":"application/vnd.github+json",
                     "Authorization":f"Bearer {token}",
                     "X-GitHub-Api-Version":"2022-11-28"}
          request = Request(f"https://api.github.com/repos/{repo}/pulls/{number}", headers=headers)
          with urlopen(request, timeout=20) as response:
              pr = json.load(response)
          head_repo = (pr.get("head",{}).get("repo") or {}).get("full_name","")
          current = (pr.get("state") == "open" and pr.get("user",{}).get("login") == "snapetech"
                     and pr.get("base",{}).get("ref") == "main"
                     and head_repo.lower() == repo.lower()
                     and pr.get("head",{}).get("ref") == branch
                     and pr.get("head",{}).get("sha","").lower() == sha
                     )
          success = current and all(v == "success" for v in results.values())
          cancelled = any(v == "cancelled" for v in results.values())
          conclusion = "success" if success else ("cancelled" if cancelled else "failure")
          details = [f"- {name}: {value}" for name,value in results.items()]
          if not current: details.append("- PR head or ownership changed; result is stale.")
          summary = "Exact-head private-JIT owner PR validation.\n\n" + "\n".join(details)
          payload = json.dumps({
              "name":os.environ["CHECK_NAME"],"head_sha":sha,
              "external_id":f"{target}:{run_id}","status":"completed",
              "conclusion":conclusion,
              "details_url":f"https://github.com/{repo}/actions/runs/{run_id}",
              "output":{"title":f"Owner PR validation {conclusion}","summary":summary}
          }).encode()
          request = Request(f"https://api.github.com/repos/{repo}/check-runs",data=payload,
                            headers={**headers,"Content-Type":"application/json"},method="POST")
          with urlopen(request, timeout=20) as response:
              if response.status not in {201,202}:
                  raise SystemExit(f"check-run API returned HTTP {response.status}")
          PY
