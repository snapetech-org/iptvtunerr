# ng-runner-policy: hosted-first-v1
name: Docker
run-name: Publish Docker ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, for example v0.1.79"
        required: true
      publish_dockerhub:
        description: "Also publish to Docker Hub (currently paused)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-docker
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require release tag on main
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main --tags
          RELEASE_REPO_DIR="$PWD" RELEASE_TAG_MAIN_MODE=latest \
            bash -c "$(git show origin/main:scripts/ensure-release-tag-on-main.sh)" release-tag-guard "$TAG"
      - name: Use the current Docker packaging recipe
        run: |
          set -euo pipefail
          git show origin/main:Dockerfile > Dockerfile
          test -s Dockerfile
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Write BuildKit network config
        id: buildkit-config
        run: |
          set -euo pipefail
          config="${RUNNER_TEMP:-/tmp}/iptvtunerr-buildkitd.toml"
          mapfile -t nameservers < <(awk '$1 == "nameserver" { print $2 }' /etc/resolv.conf)
          if [[ "${#nameservers[@]}" -eq 0 ]]; then
            nameservers=(1.1.1.1 9.9.9.9)
          fi
          quoted=""
          for ns in "${nameservers[@]}"; do
            if [[ -n "$quoted" ]]; then
              quoted+=", "
            fi
            quoted+="\"$ns\""
          done
          cat > "$config" <<EOF
          [dns]
            nameservers = [$quoted]

          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
          EOF
          echo "path=$config" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            network=host
          buildkitd-config: ${{ steps.buildkit-config.outputs.path }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: ${{ inputs.publish_dockerhub }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'snapetech' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ inputs.publish_dockerhub && 'snapetech/iptvtunerr' || '' }}
            ${{ inputs.publish_dockerhub && 'keefshape/iptvtunerr' || '' }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.RELEASE_TAG }}
      - name: Confirm release is still latest before Docker publish
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main --tags
          RELEASE_REPO_DIR="$PWD" RELEASE_TAG_MAIN_MODE=latest \
            bash -c "$(git show origin/main:scripts/ensure-release-tag-on-main.sh)" release-tag-guard "$TAG"
      - name: Build and push Docker image
        id: docker-build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
      - name: Retry Docker build and push
        if: steps.docker-build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.RELEASE_TAG }}
