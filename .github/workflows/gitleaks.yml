# ng-runner-policy: private-jit-only-v1
# Gitleaks runs only on an explicit private-JIT dispatch.
# https://github.com/gitleaks/gitleaks

name: Gitleaks

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        type: choice
        required: true
        options: [gitleaks]
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        type: choice
        required: true
        options: [private]
permissions:
  contents: read

concurrency:
  group: ng-scan-gitleaks-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  scan:
    if: inputs.action_tag == 'gitleaks' && inputs.runner_pool_tag == 'private'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Gitleaks
        run: bash scripts/install-ci-tools.sh gitleaks

      - name: Run Gitleaks
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          gitleaks dir "$tmp" --redact --verbose

