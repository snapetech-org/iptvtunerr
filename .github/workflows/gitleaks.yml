# ng-runner-policy: hosted-first-v1
# Gitleaks runs on release tags or explicit manual dispatches.
# https://github.com/gitleaks/gitleaks

name: Gitleaks

on:
  push:
    tags:
      - '**'
permissions:
  contents: read

concurrency:
  group: ng-scan-gitleaks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Gitleaks
        run: bash scripts/install-ci-tools.sh gitleaks

      - name: Run Gitleaks
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git archive HEAD | tar -x -C "$tmp"
          gitleaks dir "$tmp" --redact --verbose

