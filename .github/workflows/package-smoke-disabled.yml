# ng-runner-policy: private-jit-only-v1
name: Package Smoke Validation (disabled)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version to validate"
        required: true
      channel:
        description: "Package channel to validate"
        required: true
        default: "github-archive"
      arch:
        description: "Target architecture label"
        required: true
        default: "amd64"

jobs:
  package-smoke:
    if: false
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-package-smoke"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y bash ca-certificates curl jq unzip tar
      - name: Run package smoke
        env:
          PACKAGE_CHANNEL: ${{ inputs.channel }}
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_CHANNEL" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "Invalid package channel" >&2; exit 2; }
          [[ "$PACKAGE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid package version" >&2; exit 2; }
          [[ "$PACKAGE_ARCH" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "Invalid package architecture" >&2; exit 2; }
          packaging/smoke/package-smoke iptvtunerr "$PACKAGE_CHANNEL" "$PACKAGE_VERSION" --arch "$PACKAGE_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: package-smoke-${{ inputs.channel }}-${{ inputs.arch }}
          path: artifacts/package-smoke/
