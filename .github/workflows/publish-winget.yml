name: Publish Winget
run-name: Publish Winget ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to submit, for example v0.1.63"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-winget
  cancel-in-progress: true

jobs:
  submit:
    name: Submit Winget PR
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require release tag on main
        shell: bash
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main --tags
          RELEASE_REPO_DIR="$PWD" RELEASE_TAG_MAIN_MODE=latest \
            bash -c "$(git show origin/main:scripts/ensure-release-tag-on-main.sh)" release-tag-guard "$TAG"

      - name: Require Winget token
        shell: pwsh
        env:
          WINGETCREATE_GITHUB_TOKEN: ${{ secrets.WINGETCREATE_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGETCREATE_GITHUB_TOKEN)) {
            throw "WINGETCREATE_GITHUB_TOKEN is not configured"
          }

      - name: Download wingetcreate
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Download Windows release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version"
          }
          if ($env:RELEASE_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw "Invalid repository name"
          }
          gh release download "$env:RELEASE_VERSION" `
            --repo "$env:RELEASE_REPOSITORY" `
            --pattern "iptv-tunerr-$($env:RELEASE_VERSION)-windows-amd64.zip"

      - name: Prepare manifests
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version"
          }
          if ($env:RELEASE_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw "Invalid repository name"
          }
          $ReleaseVersion = $env:RELEASE_VERSION
          $Repository = $env:RELEASE_REPOSITORY
          $WingetVersion = $ReleaseVersion.TrimStart("v").Replace("-", ".")
          $Asset = "iptv-tunerr-$ReleaseVersion-windows-amd64.zip"
          $InstallerUrl = "https://github.com/$Repository/releases/download/$ReleaseVersion/$Asset"
          $InstallerSha = (Get-FileHash $Asset -Algorithm SHA256).Hash.ToLowerInvariant()

          bash packaging/scripts/update-winget-manifests.sh `
            $ReleaseVersion `
            $InstallerUrl `
            $InstallerSha `
            $ReleaseVersion

          $WingetSubmitPath = Join-Path "winget-submit" "manifests/s/snapetech/iptvtunerr/$WingetVersion"
          New-Item -ItemType Directory -Force $WingetSubmitPath | Out-Null
          Copy-Item packaging/winget/snapetech.iptvtunerr.yaml $WingetSubmitPath/
          Copy-Item packaging/winget/snapetech.iptvtunerr.installer.yaml $WingetSubmitPath/
          Copy-Item packaging/winget/snapetech.iptvtunerr.locale.en-US.yaml $WingetSubmitPath/
          "WINGET_SUBMIT_PATH=$WingetSubmitPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Confirm release is still latest
        shell: bash
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main --tags
          RELEASE_REPO_DIR="$PWD" RELEASE_TAG_MAIN_MODE=latest \
            bash -c "$(git show origin/main:scripts/ensure-release-tag-on-main.sh)" release-tag-guard "$TAG"

      - name: Submit manifests to winget-pkgs
        shell: pwsh
        env:
          WINGETCREATE_GITHUB_TOKEN: ${{ secrets.WINGETCREATE_GITHUB_TOKEN }}
        run: |
          .\wingetcreate.exe submit $env:WINGET_SUBMIT_PATH `
            -t $env:WINGETCREATE_GITHUB_TOKEN
