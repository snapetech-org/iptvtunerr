# ng-runner-policy: private-jit-only-v1
name: Release


run-name: >-
  ${{ format('action:{0}:pool:{1}:tag:{2}', inputs.action, inputs.runner_pool, inputs.release_tag) }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Release action
        type: choice
        options: [release]
        required: true
      runner_pool:
        description: Private ephemeral JIT runner pool
        type: choice
        options: [private]
        required: true
      release_tag:
        description: Exact version tag to build, publish, and announce
        type: string
        required: true

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'snapetech' && inputs.action == 'release' && inputs.runner_pool == 'private' && inputs.release_tag != '' }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-release"]}}', github.run_id)) }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    permissions:
      contents: write
    outputs:
      release_body: ${{ steps.generate-notes.outputs.release_body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require release tag on main
        run: ./scripts/ensure-release-tag-on-main.sh "$RELEASE_TAG"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Install verification tools
        run: bash scripts/install-ci-tools.sh ripgrep

      - name: Require populated changelog section
        run: ./scripts/verify-changelog-entry.sh release "$RELEASE_TAG"

      - name: Verify changelog matches release-note fragments
        run: node scripts/verify-release-changelog.mjs "$RELEASE_TAG"

      - name: Verify changelog history and tag coverage
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${RELEASE_TAG}^")"
          node scripts/check-changelog-tags.mjs "$previous_tag" "$RELEASE_TAG"

      - name: Verify
        run: ./scripts/verify

      - name: Release smoke
        run: go test -count=1 ./internal/tuner -run 'Test(XMLTV_serve|XMLTV_serveCachedGuideReady|HDHR_discover|HDHR_lineup|HDHR_lineup_status|Server_UpdateChannelsTriggersXMLTVRefresh)'

      - name: Install Linux package tools
        run: bash scripts/install-ci-tools.sh rpm zip debian-packaging

      - name: Build binaries
        run: ./scripts/build-release-assets.sh "$RELEASE_TAG" dist

      - name: Build Linux package assets
        run: ./scripts/build-linux-package-assets.sh "$RELEASE_TAG" dist

      - name: Verify release assets
        run: ./scripts/verify-release-assets.sh "$RELEASE_TAG" dist

      - name: Generate release notes
        id: generate-notes
        run: |
          set -euo pipefail
          chmod +x ./scripts/generate-release-notes.sh
          ./scripts/generate-release-notes.sh "$RELEASE_TAG" dist/release-notes.md
          cat dist/release-notes.md
          delimiter="release_body_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          while grep -Fxq "$delimiter" dist/release-notes.md; do
            delimiter+="_"
          done
          {
            echo "release_body<<${delimiter}"
            cat dist/release-notes.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.release_tag }}
          body_path: dist/release-notes.md
          files: |
            dist/iptv-tunerr-*
            dist/iptvtunerr_*.deb
            dist/*.rpm
            dist/release-manifest.json
            dist/SHA256SUMS.txt

  publish-tester-bundles:
    name: Publish tester packages from this release tag
    needs: [release]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/tester-bundles.yml
    with:
      tag: ${{ inputs.release_tag }}

  publish-docker:
    name: Publish Docker image from this release tag
    needs: [release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ inputs.release_tag }}
      publish_dockerhub: false
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  announce-discord:
    name: Announce Release to Discord
    needs: [release]
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-announce-discord"]}}', github.run_id)) }}
    env:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
      RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}
      RELEASE_BODY: ${{ needs.release.outputs.release_body }}
      VERSION: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'

      - name: Install announcement tools
        run: bash scripts/install-ci-tools.sh jq

      - name: Send Discord release notes
        run: |
          set -euo pipefail

          test -n "$DISCORD_RELEASE_WEBHOOK" || {
            echo 'DISCORD_RELEASE_WEBHOOK is required to complete a release.' >&2
            exit 1
          }

          summary_file="$RUNNER_TEMP/iptvtunerr-discord-release-summary.md"
          chunks_file="$RUNNER_TEMP/iptvtunerr-discord-release-chunks.json"
          printf '%s' "$RELEASE_BODY" | node scripts/discord-release-notes.mjs --format > "$summary_file"
          node scripts/discord-release-notes.mjs --split < "$summary_file" > "$chunks_file"
          chunk_count="$(jq 'length' "$chunks_file")"
          (( chunk_count > 0 )) || {
            echo 'The generated release notes are empty.' >&2
            exit 1
          }

          webhook_url="$DISCORD_RELEASE_WEBHOOK"
          if [[ "$webhook_url" == *'?'* ]]; then
            webhook_url+='&wait=true'
          else
            webhook_url+='?wait=true'
          fi

          for ((index = 0; index < chunk_count; index += 1)); do
            description="$(jq -r --argjson index "$index" '.[$index]' "$chunks_file")"
            number=$((index + 1))
            title="IPTV Tunerr ${VERSION} release notes (${number}/${chunk_count})"
            payload_file="$RUNNER_TEMP/iptvtunerr-discord-release-payload.json"
            jq -n \
              --arg title "$title" \
              --arg url "$RELEASE_URL" \
              --arg description "$description" \
              --arg release_url "$RELEASE_URL" \
              --argjson first "$index" \
              '{
                allowed_mentions: { parse: [] },
                username: "IPTV Tunerr Releases",
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 5814783,
                  footer: { text: "IPTV Tunerr release" },
                  fields: (if $first == 0 then [
                    { name: "Downloads & checksums", value: ("[View release assets and SHA256SUMS](" + $release_url + ")"), inline: false }
                  ] else [] end)
                }]
              }' > "$payload_file"

            response="$(curl --fail --silent --show-error \
              -H 'Content-Type: application/json' \
              -X POST \
              --data @"$payload_file" \
              "$webhook_url")"
            jq -e --arg description "$description" \
              '.id != null and .embeds[0].description == $description' \
              <<< "$response" > /dev/null
            if (( number < chunk_count )); then
              sleep 1
            fi
          done

      - name: Post Matrix announcement
        if: always()
        env:
          MATRIX_RELEASE_ACCESS_TOKEN: ${{ secrets.TIMEWAYS_MATRIX_RELEASE_TOKEN }}
          MATRIX_BASE_URL: https://matrix.timeways.net
          MATRIX_ROOM_ID: '!feVqoCPCPPaCQmTCEE:timeways.net'
          MATRIX_PROJECT_KEY: iptvtunerr
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.release_tag }}
          VERSION: ${{ inputs.release_tag }}
          RELEASE_BODY: ${{ needs.release.outputs.release_body }}
        run: |
          set -euo pipefail

          if [ -z "$MATRIX_RELEASE_ACCESS_TOKEN" ]; then
            echo "TIMEWAYS_MATRIX_RELEASE_TOKEN is not configured; skipping Matrix announcement."
            exit 0
          fi

          if [ -z "$RELEASE_BODY" ]; then
            echo "Curated release notes are empty; skipping Matrix announcement."
            exit 0
          fi

          chunks_file="$RUNNER_TEMP/iptvtunerr-matrix-release-chunks.json"
          printf '%s' "$RELEASE_BODY" | node scripts/discord-release-notes.mjs --split > "$chunks_file"
          chunk_count="$(jq 'length' "$chunks_file")"
          (( chunk_count > 0 )) || {
            echo "The generated Matrix release notes are empty; skipping announcement."
            exit 0
          }

          today_utc="$(date -u +%F)"
          marker="releasebot-project:${MATRIX_PROJECT_KEY}"
          sync_filter="$(jq -cn --arg room "$MATRIX_ROOM_ID" '{"room":{"rooms":[ $room ],"timeline":{"limit":50}}}')"
          sync_filter_encoded="$(SYNC_FILTER="$sync_filter" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SYNC_FILTER"], safe=""))')"

          previous_event_ids="$(
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${MATRIX_RELEASE_ACCESS_TOKEN}" \
              "${MATRIX_BASE_URL}/_matrix/client/r0/sync?timeout=0&filter=${sync_filter_encoded}" |
              jq -r \
                --arg room "$MATRIX_ROOM_ID" \
                --arg marker "$marker" \
                --arg today "$today_utc" \
                '
                  [.rooms.join[$room].timeline.events[]?
                    | select(.sender == "@releasebot:timeways.net")
                    | select(.type == "m.room.message")
                    | select((.content.formatted_body // "") | contains($marker))
                    | select((.origin_server_ts / 1000 | strftime("%F")) == $today)
                  ]
                  | sort_by(.origin_server_ts)
                  | .[]
                  | .event_id // empty
                '
          )"

          if [ -n "$previous_event_ids" ]; then
            index=0
            while IFS= read -r previous_event_id; do
              [ -n "$previous_event_id" ] || continue
              redact_txn="redact-${MATRIX_PROJECT_KEY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${index}"
              if ! curl --fail --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${MATRIX_RELEASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{"reason":"Superseded by newer release announcement"}' \
                "${MATRIX_BASE_URL}/_matrix/client/r0/rooms/%21feVqoCPCPPaCQmTCEE%3Atimeways.net/redact/${previous_event_id}/${redact_txn}"; then
                echo "Matrix release-announcement redact failed; continuing without failing the release workflow."
              fi
              index=$((index + 1))
            done <<< "$previous_event_ids"
          fi

          release_html="$(jq -nr --arg text "$RELEASE_URL" '$text | @html')"
          version_html="$(jq -nr --arg text "$VERSION" '$text | @html')"
          for ((index = 0; index < chunk_count; index += 1)); do
            notes="$(jq -r --argjson index "$index" '.[$index]' "$chunks_file")"
            number=$((index + 1))
            notes_html="$(jq -nr --arg text "$notes" '$text | @html | gsub("\n"; "<br>")')"
            body="$(printf '📡 Tunerr release notes (%s/%s)\nVersion: %s\nRelease: %s\n\n%s' \
              "$number" "$chunk_count" "$VERSION" "$RELEASE_URL" "$notes")"
            html="<p>📡 Tunerr release notes (${number}/${chunk_count})<br>Version: <code>${version_html}</code><br>Release: <a href=\"${release_html}\">${release_html}</a></p><p>${notes_html}</p><!-- ${marker} -->"
            payload="$(jq -cn --arg body "$body" --arg html "$html" '{msgtype:"m.text", body:$body, format:"org.matrix.custom.html", formatted_body:$html}')"
            txn_id="${MATRIX_PROJECT_KEY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${index}"

            if response="$(curl --fail --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer ${MATRIX_RELEASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "${MATRIX_BASE_URL}/_matrix/client/r0/rooms/%21feVqoCPCPPaCQmTCEE%3Atimeways.net/send/m.room.message/${txn_id}")"; then
              if ! jq -e '.event_id | type == "string" and length > 0' <<< "$response" > /dev/null; then
                echo "Matrix accepted a response without an event ID; continuing without failing the release workflow."
              fi
            else
              echo "Matrix release-announcement chunk ${number}/${chunk_count} failed; continuing without failing the release workflow."
              exit 0
            fi

            if (( number < chunk_count )); then
              sleep 1
            fi
          done

  dispatch-package-channels:
    name: Publish Release Channels
    needs: [release]
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-dispatch-package-channels"]}}', github.run_id)) }}
    timeout-minutes: 240
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dispatch tools
        run: bash scripts/install-ci-tools.sh gh

      - name: Dispatch channel workflows
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_TOKEN || github.token }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          bash scripts/dispatch-release-channels.sh "$TAG" "$REPO"
