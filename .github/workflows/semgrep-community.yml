# ng-runner-policy: private-jit-only-v1
name: Semgrep Community Edition

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        type: choice
        required: true
        options: [semgrep]
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        type: choice
        required: true
        options: [private]

permissions:
  contents: read

concurrency:
  group: ng-scan-semgrep-community-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  semgrep:
    name: Semgrep CE (community rules)
    if: inputs.action_tag == 'semgrep' && inputs.runner_pool_tag == 'private'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}"]}}', github.run_id)) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan with the current Semgrep CE image and p/default rules
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e EIO_BACKEND=posix \
            -e HTTP_PROXY -e HTTPS_PROXY -e http_proxy -e https_proxy \
            -e NO_PROXY -e no_proxy \
            -e REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
            -e CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -v /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro \
            -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:latest \
            semgrep scan --config p/default --metrics=off --jobs 2 \
              --json-output semgrep.json --sarif-output semgrep.sarif .

      - name: Report finding count
        if: always() && hashFiles('semgrep.json') != ''
        run: |
          jq -r '"Semgrep CE reported \(.results | length) finding(s). Review semgrep.sarif and the scan log."' semgrep.json

      - name: Retain scan report (semgrep)
        if: >-
          always() &&
          (hashFiles('semgrep.sarif') != '' || hashFiles('semgrep.json') != '') &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-report-semgrep-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            semgrep.sarif
            semgrep.json
          if-no-files-found: warn
          retention-days: 14
