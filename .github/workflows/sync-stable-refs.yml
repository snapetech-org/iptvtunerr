# ng-runner-policy: private-jit-only-v1
name: Sync stable refs

# After a release or container publish, keep `master` and the `latest` image
# aligned with the newest stable tag. See scripts/sync-stable-refs.sh.
on:
  workflow_run:
    workflows: ["Release", "Docker"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        type: choice
        required: true
        options: [sync-stable-refs]
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        type: choice
        required: true
        options: [private]

concurrency:
  group: sync-stable-refs
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action_tag == 'sync-stable-refs' &&
          inputs.runner_pool_tag == 'private'
        )
      ) &&
      (
        github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-sync"]}}', github.run_id)) }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Sync master and verify the latest image
        env:
          # The Release run precedes the image publish, so only check the image after Docker (or manually).
          IMAGE: ${{ github.event.workflow_run.name != 'Release' && format('ghcr.io/{0}', github.repository) || '' }}
        run: ./scripts/sync-stable-refs.sh --apply
