# ng-runner-policy: private-jit-only-v1
# packer-windows-jit-v1
name: Windows Smoke

run-name: ${{ format('action:{0}:pool:{1}', inputs.action_tag, inputs.runner_pool_tag) }}

on:
  workflow_dispatch:
    inputs:
      action_tag:
        description: Action to run
        type: choice
        required: true
        options: [ci]
      runner_pool_tag:
        description: Private ephemeral JIT runner pool
        type: choice
        required: true
        options: [private]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action_tag == 'ci' &&
      inputs.runner_pool_tag == 'private' &&
      github.actor == 'snapetech' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(format('{{"group":"packer-windows","labels":["self-hosted","Windows","X64","packer-windows","ng-shared-main-iptvtunerr","ng-main-run-{0}","gha-{0}-build"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Windows binary
        shell: pwsh
        run: go build ./cmd/iptv-tunerr

      - name: Run focused Windows-safe tests
        shell: pwsh
        run: |
          go test ./cmd/... ./internal/config ./internal/provider ./internal/safeurl ./internal/store
