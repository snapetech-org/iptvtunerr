name: Windows Smoke

on:
  workflow_dispatch:
  push:
    tags:
      - '**'
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Windows binary
        shell: pwsh
        run: go build ./cmd/iptv-tunerr

      - name: Run focused Windows-safe tests
        shell: pwsh
        run: |
          go test ./cmd/... ./internal/config ./internal/provider ./internal/safeurl ./internal/store
