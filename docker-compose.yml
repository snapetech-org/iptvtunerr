# IPTV Tunerr — run without Kubernetes.
# 1. Copy .env.example to .env and set provider credentials + IPTV_TUNERR_BASE_URL (e.g. http://YOUR_HOST_IP:5004).
# 2. docker compose up -d
# 3. Verify: curl -s -o /dev/null -w "%{http_code}" http://localhost:5004/discover.json  # expect 200
# The authenticated Control Deck is bound to host loopback at http://127.0.0.1:48879/.

services:
  iptvtunerr:
    build: .
    image: iptv-tunerr:local
    ports:
      - "5004:5004"
      - "127.0.0.1:48879:48879"
    env_file: .env
    environment:
      IPTV_TUNERR_DB_PATH: /var/lib/iptvtunerr/tunerr.db
      # Docker bridge clients are non-loopback inside the container; the published port above
      # remains host-loopback-only unless an operator changes that binding.
      IPTV_TUNERR_WEBUI_ALLOW_LAN: "1"
    volumes:
      - iptvtunerr_data:/var/lib/iptvtunerr
    command: ["run", "-addr", ":5004"]
    restart: unless-stopped

volumes:
  iptvtunerr_data:
